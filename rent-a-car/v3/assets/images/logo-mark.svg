<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Drivo Rent-a-Car v3 mark: tangerine squircle badge with a friendly car front (grille + headlights) -->
  <defs>
    <linearGradient id="skl-v3-badge" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8a45"/>
      <stop offset="1" stop-color="#f25f0c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#skl-v3-badge)"/>
  <!-- cabin + windscreen -->
  <path d="M19.5 28.5 23.2 19.6A3.4 3.4 0 0 1 26.4 17.5h11.2a3.4 3.4 0 0 1 3.2 2.1l3.7 8.9" stroke="#fff" stroke-width="3.6" stroke-linejoin="round"/>
  <path d="M25.6 27.2 27.8 21.8h8.4l2.2 5.4z" fill="#fff" fill-opacity=".35"/>
  <!-- tyres -->
  <rect x="15.5" y="40" width="8" height="7.5" rx="2.6" fill="#1a1a1a"/>
  <rect x="40.5" y="40" width="8" height="7.5" rx="2.6" fill="#1a1a1a"/>
  <!-- body -->
  <rect x="12.5" y="27" width="39" height="15" rx="6" fill="#fff"/>
  <!-- headlights -->
  <circle cx="20.2" cy="34.2" r="3.1" fill="#1a1a1a"/>
  <circle cx="43.8" cy="34.2" r="3.1" fill="#1a1a1a"/>
  <!-- smiling grille -->
  <path d="M27.4 33.4c2.9 2.6 6.3 2.6 9.2 0" stroke="#ff7326" stroke-width="2.6" stroke-linecap="round"/>
</svg>
